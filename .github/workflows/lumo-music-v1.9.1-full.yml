name: Build Lumo Music Mini v1.9.1 Full

on:
  push:
    branches:
      - lumo-music-mini-v1-9-apk-build

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Restore full source
        run: |
          cat lumo-music-build/part_*.txt | tr -d '\n' | base64 -d > /tmp/lumo-source.zip
          mkdir -p /tmp/lumo-source
          unzip -q /tmp/lumo-source.zip -d /tmp/lumo-source
          test -f /tmp/lumo-source/LumoMusicMini/app/src/main/java/com/lumomusic/mini/MainActivity.kt
          grep -q 'versionName = "1.9.1"' /tmp/lumo-source/LumoMusicMini/app/build.gradle.kts
          grep -q 'listOf(30, 60, 120)' /tmp/lumo-source/LumoMusicMini/app/src/main/java/com/lumomusic/mini/MainActivity.kt
          grep -q 'vocalsEnabled = mode == CreationMode.SONG' /tmp/lumo-source/LumoMusicMini/app/src/main/java/com/lumomusic/mini/MainActivity.kt
          sed -i 's/compileSdk = 37/compileSdk = 36/' /tmp/lumo-source/LumoMusicMini/app/build.gradle.kts
          sed -i 's/targetSdk = 37/targetSdk = 36/' /tmp/lumo-source/LumoMusicMini/app/build.gradle.kts
          sed -i 's/androidx.activity:activity-compose:1.13.0/androidx.activity:activity-compose:1.10.1/' /tmp/lumo-source/LumoMusicMini/app/build.gradle.kts
          sed -i 's/androidx.compose.ui:ui:1.12.1/androidx.compose.ui:ui:1.8.3/' /tmp/lumo-source/LumoMusicMini/app/build.gradle.kts
          sed -i 's/androidx.compose.ui:ui-tooling-preview:1.12.1/androidx.compose.ui:ui-tooling-preview:1.8.3/' /tmp/lumo-source/LumoMusicMini/app/build.gradle.kts
          sed -i 's/androidx.compose.foundation:foundation:1.12.1/androidx.compose.foundation:foundation:1.8.3/' /tmp/lumo-source/LumoMusicMini/app/build.gradle.kts
          sed -i 's/androidx.compose.material3:material3:1.4.0/androidx.compose.material3:material3:1.3.2/' /tmp/lumo-source/LumoMusicMini/app/build.gradle.kts
          sed -i 's/androidx.lifecycle:lifecycle-runtime-ktx:2.11.0/androidx.lifecycle:lifecycle-runtime-ktx:2.9.1/' /tmp/lumo-source/LumoMusicMini/app/build.gradle.kts
          sed -i 's/androidx.compose.ui:ui-tooling:1.12.1/androidx.compose.ui:ui-tooling:1.8.3/' /tmp/lumo-source/LumoMusicMini/app/build.gradle.kts

      - name: Build full APK
        working-directory: /tmp/lumo-source/LumoMusicMini
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify full APK
        working-directory: /tmp/lumo-source/LumoMusicMini
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -q 'assets/models/tiny_sakha_subword_language_model_v2.json'
          unzip -l "$APK" | grep -q 'assets/models/tiny_recurrent_wave_decoder_v2.json'
          unzip -l "$APK" | grep -q 'assets/language/sakha_phonology_v1.json'
          echo "APK bytes: $(stat -c%s "$APK")"
          sha256sum "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: LumoMusicMini-v1.9.1-full-debug-apk
          path: /tmp/lumo-source/LumoMusicMini/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
