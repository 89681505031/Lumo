name: Build Lumo Music Mini v2.0 Vocal Focus

on:
  push:
    branches:
      - lumo-music-mini-v1-9-apk-build

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Restore v2.0 source
        run: |
          cat lumo-music-build/v2_part_*.txt | tr -d '\n' | base64 -d > /tmp/lumo-v2.zip
          mkdir -p /tmp/lumo-v2
          unzip -q /tmp/lumo-v2.zip -d /tmp/lumo-v2
          test -f /tmp/lumo-v2/LumoMusicMini/app/src/main/java/com/lumomusic/mini/audio/VocalPerformancePlanner.kt
          grep -q 'versionName = "2.0.0"' /tmp/lumo-v2/LumoMusicMini/app/build.gradle.kts
          grep -q 'VocalPerformancePlanner.plan' /tmp/lumo-v2/LumoMusicMini/app/src/main/java/com/lumomusic/mini/audio/RecurrentWaveVocalEngine.kt
          grep -q 'vocalPresence' /tmp/lumo-v2/LumoMusicMini/app/src/main/java/com/lumomusic/mini/audio/SequenceSynthRenderer.kt

      - name: Build v2.0 APK
        working-directory: /tmp/lumo-v2/LumoMusicMini
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify v2.0 APK
        working-directory: /tmp/lumo-v2/LumoMusicMini
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -s "$APK"
          "$AAPT" dump badging "$APK" | grep -q "versionName='2.0.0'"
          ! "$AAPT" dump permissions "$APK" | grep -q 'android.permission.INTERNET'
          unzip -l "$APK" | grep -q 'assets/models/tiny_sakha_subword_language_model_v2.json'
          unzip -l "$APK" | grep -q 'assets/models/tiny_recurrent_wave_decoder_v2.json'
          unzip -l "$APK" | grep -q 'assets/language/sakha_phonology_v1.json'
          echo "APK bytes: $(stat -c%s "$APK")"
          sha256sum "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: LumoMusicMini-v2.0-vocal-focus-apk
          path: /tmp/lumo-v2/LumoMusicMini/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
