name: Android
on:
  push:
    branches: [main, design/luma-glass-ui, feature/lumo-cosmic-personalization, feature/lumo-cosmic-media, feature/lumo-cosmic-calls-push-lab]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build Android APKs
        env:
          LUMO_VERSION_CODE: ${{ github.run_number }}
        run: gradle testDebugUnitTest testReleaseUnitTest assembleDebug assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: lumo-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: lumo-release-unsigned-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
