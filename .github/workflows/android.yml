name: Android
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        env:
          LUMO_VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleDebug
      - name: Verify release manifest does not request staging microphone permissions
        run: |
          gradle processReleaseMainManifest
          manifest="$(find app/build/intermediates/merged_manifests/release -name AndroidManifest.xml -print -quit)"
          if [ -z "$manifest" ] || [ ! -f "$manifest" ]; then
            echo "Could not locate merged release manifest"
            exit 1
          fi
          if grep -Eq 'android.permission.(RECORD_AUDIO|MODIFY_AUDIO_SETTINGS)' "$manifest"; then
            echo "A staging-only microphone permission leaked into the release variant"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: lumo-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
