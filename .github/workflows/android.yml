name: Android
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        env:
          LUMO_VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleDebug
      - name: Compile production variant and enforce notification privacy
        run: |
          gradle :app:compileReleaseKotlin :app:processReleaseMainManifest
          manifest="$(find app/build/intermediates -name AndroidManifest.xml -path '*/release/*' -print -quit)"
          if [ -z "$manifest" ] || [ ! -f "$manifest" ]; then
            echo "Missing merged production manifest"
            exit 1
          fi
          if grep -Eq 'android.permission.POST_NOTIFICATIONS|LumoDebugFirebaseService' "$manifest"; then
            echo "Experimental FCM service/permission leaked into production"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: lumo-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
