name: Android
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        env:
          LUMO_VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleDebug
      - name: Test data-only FCM envelope validator
        run: gradle :app:testDebugUnitTest :app:testReleaseUnitTest
      - name: Compile production variant and enforce notification privacy
        run: |
          gradle :app:compileReleaseKotlin :app:processReleaseMainManifest
          manifest="$(find app/build/intermediates -name AndroidManifest.xml -path '*/release/*' -print -quit)"
          if [ -z "$manifest" ] || [ ! -f "$manifest" ]; then
            echo "Missing merged production manifest"
            exit 1
          fi
          if grep -Eq 'android.permission.POST_NOTIFICATIONS|LumoDebugFirebaseService' "$manifest"; then
            echo "Experimental FCM service/permission leaked into production"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: lumo-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  verify-staging-fcm-compile:
    # Use a synthetic, impossible Firebase identity solely for PR compile tests.
    # No credentials, service account or real staging configuration are present.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compile opt-in staging integration using a synthetic Firebase config
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f app/google-services.json' EXIT
          cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "lumo-ci-invalid",
              "storage_bucket": "lumo-ci-invalid.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:123456789012:android:abcdef0123456789",
                "android_client_info": {"package_name": "app.lumo.staging"}
              },
              "oauth_client": [],
              "api_key": [{"current_key": "synthetic-ci-key-not-for-firebase-use"}],
              "services": {"appinvite_service": {"other_platform_oauth_client": []}}
            }],
            "configuration_version": "1"
          }
          EOF
          gradle :app:assembleDebug -PlumoStagingUrl=https://staging.example.test -PlumoEnableFcm=true
          manifest="$(find app/build/intermediates -name AndroidManifest.xml -path '*/debug/*' -print -quit)"
          if [ -z "$manifest" ] || [ ! -f "$manifest" ]; then
            echo "Missing merged staging manifest"
            exit 1
          fi
          grep -q 'LumoDebugFirebaseService' "$manifest"
          grep -q 'android.permission.POST_NOTIFICATIONS' "$manifest"
          if ! find app/build/generated/res/google-services -name values.xml -exec grep -l '123456789012' {} + | grep -q .; then
            echo "Synthetic Firebase resources were not generated"
            exit 1
          fi
