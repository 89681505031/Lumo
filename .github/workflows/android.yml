name: Android
on:
  push:
    branches: [main, design/luma-glass-ui, feature/lumo-cosmic-personalization, feature/lumo-cosmic-media, feature/lumo-cosmic-calls-push-lab]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-debug:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run tests and build debug APK
        env:
          LUMO_VERSION_CODE: ${{ github.run_number }}
        run: gradle testDebugUnitTest testReleaseUnitTest assembleDebug

      - name: Prepare persistent release signing
        shell: bash
        env:
          LUMO_KEYSTORE_B64: ${{ secrets.LUMO_KEYSTORE_B64 }}
          LUMO_KEYSTORE_PASSWORD_SECRET: ${{ secrets.LUMO_KEYSTORE_PASSWORD }}
          LUMO_KEY_ALIAS_SECRET: ${{ secrets.LUMO_KEY_ALIAS }}
          LUMO_KEY_PASSWORD_SECRET: ${{ secrets.LUMO_KEY_PASSWORD }}
        run: |
          if [ -n "$LUMO_KEYSTORE_B64" ] \
            && [ -n "$LUMO_KEYSTORE_PASSWORD_SECRET" ] \
            && [ -n "$LUMO_KEY_ALIAS_SECRET" ] \
            && [ -n "$LUMO_KEY_PASSWORD_SECRET" ]; then
            printf '%s' "$LUMO_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/lumo-release.jks"
            test -s "$RUNNER_TEMP/lumo-release.jks"
            echo "LUMO_KEYSTORE_PATH=$RUNNER_TEMP/lumo-release.jks" >> "$GITHUB_ENV"
            echo "LUMO_SIGNED_RELEASE=true" >> "$GITHUB_ENV"
          else
            echo "LUMO_SIGNED_RELEASE=false" >> "$GITHUB_ENV"
            echo "::notice::Persistent release-signing secrets are not configured; CI will use the verified deterministic Lumo 1.0.9 reconstruction path after building the unsigned APK."
          fi

      - name: Build Lumo 1.0.9 release APK
        env:
          LUMO_VERSION_CODE: "1009"
          LUMO_VERSION_NAME: "1.0.9"
          LUMO_KEYSTORE_PASSWORD: ${{ secrets.LUMO_KEYSTORE_PASSWORD }}
          LUMO_KEY_ALIAS: ${{ secrets.LUMO_KEY_ALIAS }}
          LUMO_KEY_PASSWORD: ${{ secrets.LUMO_KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Recover verified signed Lumo 1.0.9 release
        if: env.LUMO_SIGNED_RELEASE != 'true' && github.event_name != 'pull_request'
        shell: bash
        env:
          LUMO_EXPECTED_UNSIGNED_SHA256: "eecf468fa115873ffa8002fd52053e4367d0e493ec667623e8306ae86b9e5152"
          LUMO_EXPECTED_SIGNED_SHA256: "01407c41f88d32d7382b8e9cf6235ee6a22723ca2c7f7b6d66995cb7d957bee6"
          LUMO_EXPECTED_PATCH_XZ_SHA256: "c6cc34ae5917fd61801e06c95bdd6d8738248cbb86cd009c245aa453188651be"
          LUMO_EXPECTED_PATCH_ZST_SHA256: "01f8c277033be753cd6c35008eb78bce2e07161a538da71ba8056d46ad3271f7"
        run: |
          set -euo pipefail
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED="app/build/outputs/apk/release/app-release.apk"
          PATCH_B64="$RUNNER_TEMP/lumo-1.0.9-signature.patch.zst.xz.b64"
          PATCH_XZ="$RUNNER_TEMP/lumo-1.0.9-signature.patch.zst.xz"
          PATCH_ZST="$RUNNER_TEMP/lumo-1.0.9-signature.patch.zst"

          test -f "$UNSIGNED"
          for PART in signing/lumo-1.0.9-signature.patch.part{00..03}; do
            test -s "$PART"
          done
          command -v xz >/dev/null
          command -v zstd >/dev/null

          ACTUAL_UNSIGNED="$(sha256sum "$UNSIGNED" | awk '{print $1}')"
          if [ "$ACTUAL_UNSIGNED" != "$LUMO_EXPECTED_UNSIGNED_SHA256" ]; then
            echo "::error::Unsigned Lumo 1.0.9 APK is not byte-for-byte reproducible. Refusing signature reconstruction."
            echo "::error::Expected $LUMO_EXPECTED_UNSIGNED_SHA256 but got $ACTUAL_UNSIGNED"
            exit 1
          fi

          cat signing/lumo-1.0.9-signature.patch.part{00..03} > "$PATCH_B64"
          base64 --decode "$PATCH_B64" > "$PATCH_XZ"
          echo "$LUMO_EXPECTED_PATCH_XZ_SHA256  $PATCH_XZ" | sha256sum --check -
          xz --decompress --stdout "$PATCH_XZ" > "$PATCH_ZST"
          echo "$LUMO_EXPECTED_PATCH_ZST_SHA256  $PATCH_ZST" | sha256sum --check -

          rm -f "$SIGNED"
          zstd --quiet --decompress --patch-from="$UNSIGNED" "$PATCH_ZST" -o "$SIGNED"
          echo "$LUMO_EXPECTED_SIGNED_SHA256  $SIGNED" | sha256sum --check -
          echo "LUMO_SIGNED_RELEASE=true" >> "$GITHUB_ENV"
          echo "Verified deterministic Lumo 1.0.9 signed APK reconstruction complete."

      - name: Verify release signature
        if: env.LUMO_SIGNED_RELEASE == 'true'
        shell: bash
        env:
          LUMO_EXPECTED_CERT_SHA256: "4d0c7d55658a469902a4935c41ba2e2a3f7a7fab6506319e67b7aa1c90bbc78b"
        run: |
          TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          VERIFY_OUTPUT="$("$TOOLS_DIR/apksigner" verify --verbose --print-certs "$APK")"
          printf '%s\n' "$VERIFY_OUTPUT"
          ACTUAL_CERT="$(printf '%s\n' "$VERIFY_OUTPUT" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1 | tr '[:upper:]' '[:lower:]')"
          if [ -z "$ACTUAL_CERT" ]; then
            echo "::error::Could not read the release signing certificate digest."
            exit 1
          fi
          if [ "$ACTUAL_CERT" != "$LUMO_EXPECTED_CERT_SHA256" ]; then
            echo "::error::Release signing certificate mismatch. Refusing to publish an APK that cannot update existing Lumo installations."
            exit 1
          fi
          echo "Lumo release certificate verified: $ACTUAL_CERT"

      - uses: actions/upload-artifact@v4
        with:
          name: lumo-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        if: env.LUMO_SIGNED_RELEASE == 'true'
        with:
          name: lumo-release-signed-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - uses: actions/upload-artifact@v4
        if: env.LUMO_SIGNED_RELEASE != 'true'
        with:
          name: lumo-release-unsigned-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Require signed release on main
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && env.LUMO_SIGNED_RELEASE != 'true'
        shell: bash
        run: |
          echo "::error::Production main build has no verified signed release APK. Refusing publication."
          exit 1


      - name: Publish signed APK to lumo-latest
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && env.LUMO_SIGNED_RELEASE == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          PUBLISH_APK="$RUNNER_TEMP/Lumo.apk"
          test -f "$APK"
          cp "$APK" "$PUBLISH_APK"
          if gh release view lumo-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit lumo-latest \
              --repo "$GITHUB_REPOSITORY" \
              --title "Lumo 1.0.9" \
              --notes "versionCode=1009" \
              --latest
          else
            gh release create lumo-latest "$PUBLISH_APK" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Lumo 1.0.9" \
              --notes "versionCode=1009" \
              --latest
            exit 0
          fi
          for LEGACY_ASSET in app-debug.apk app-release.apk app-release-unsigned.apk; do
            gh release delete-asset lumo-latest "$LEGACY_ASSET" \
              --repo "$GITHUB_REPOSITORY" \
              --yes || true
          done
          gh release upload lumo-latest "$PUBLISH_APK" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Package official Android apksigner
        shell: bash
        run: |
          TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$TOOLS_DIR/apksigner"
          test -f "$TOOLS_DIR/lib/apksigner.jar"
          mkdir -p /tmp/lumo-apksigner/lib
          cp "$TOOLS_DIR/apksigner" /tmp/lumo-apksigner/
          cp "$TOOLS_DIR/lib/apksigner.jar" /tmp/lumo-apksigner/lib/

      - uses: actions/upload-artifact@v4
        with:
          name: lumo-apksigner-tool
          path: /tmp/lumo-apksigner
