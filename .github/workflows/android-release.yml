name: Verified Android release APK

# Deliberately manual. Publishing a GitHub Release is a separate owner decision.
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Unique, increasing Android versionCode (higher than previously installed)"
        type: number
        required: true

permissions:
  contents: read

jobs:
  signed-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - name: Only build release artifacts from main
        env:
          LUMO_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          if [[ "$GITHUB_REF_NAME" != "main" ]]; then
            echo "Release workflow must run on main after reviewed changes are merged."
            exit 1
          fi
          if [[ ! "$LUMO_VERSION_CODE" =~ ^[0-9]+$ ]] || (( LUMO_VERSION_CODE <= 18 )); then
            echo "version_code must be an integer greater than 18."
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Prepare release signing material
        env:
          KEYSTORE_BASE64: ${{ secrets.LUMO_KEYSTORE_BASE64 }}
          LUMO_KEYSTORE_PASSWORD: ${{ secrets.LUMO_KEYSTORE_PASSWORD }}
          LUMO_KEY_ALIAS: ${{ secrets.LUMO_KEY_ALIAS }}
          LUMO_KEY_PASSWORD: ${{ secrets.LUMO_KEY_PASSWORD }}
          EXPECTED_FINGERPRINT: ${{ vars.LUMO_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$LUMO_KEYSTORE_PASSWORD" || -z "$LUMO_KEY_ALIAS" || -z "$LUMO_KEY_PASSWORD" ]]; then
            echo "Release signing secrets are not configured."
            exit 1
          fi
          if [[ -z "$EXPECTED_FINGERPRINT" ]]; then
            echo "Configure LUMO_RELEASE_CERT_SHA256 to the trusted release signing certificate digest."
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lumo-release.jks"
          echo "LUMO_KEYSTORE_PATH=$RUNNER_TEMP/lumo-release.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK
        env:
          LUMO_KEYSTORE_PASSWORD: ${{ secrets.LUMO_KEYSTORE_PASSWORD }}
          LUMO_KEY_ALIAS: ${{ secrets.LUMO_KEY_ALIAS }}
          LUMO_KEY_PASSWORD: ${{ secrets.LUMO_KEY_PASSWORD }}
          LUMO_VERSION_CODE: ${{ inputs.version_code }}
        run: gradle --no-daemon assembleRelease
      - name: Verify signing certificate, package and artifact fingerprint
        env:
          EXPECTED_FINGERPRINT: ${{ vars.LUMO_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -x "$APKSIGNER"
          CERT_OUTPUT=$("$APKSIGNER" verify --print-certs "$APK")
          ACTUAL=$(printf '%s\n' "$CERT_OUTPUT" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          EXPECTED=$(printf '%s' "$EXPECTED_FINGERPRINT" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          if [[ ! "$EXPECTED" =~ ^[0-9A-F]{64}$ || "$ACTUAL" != "$EXPECTED" ]]; then
            echo "Signing certificate does not match the trusted release certificate. Refusing artifact."
            exit 1
          fi
          echo "### Lumo verified Android release" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Certificate SHA-256: $ACTUAL" >> "$GITHUB_STEP_SUMMARY"
          sha256sum "$APK" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: verified-lumo-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
      - name: Remove signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/lumo-release.jks"
