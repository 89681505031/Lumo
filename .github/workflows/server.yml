name: Server
on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/server.yml"
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/server.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lumo_test
          POSTGRES_PASSWORD: lumo_test
          POSTGRES_DB: lumo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lumo_test -d lumo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      LUMO_TEST_DATABASE_URL: postgresql://lumo_test:lumo_test@127.0.0.1:5432/lumo_test
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --ignore-scripts
      - run: npm run check
      # Integration files share one disposable PostgreSQL service; run files serially.
      # Individual tests still exercise multi-process/cross-instance behavior explicitly.
      - run: node --test --test-concurrency=1 test/*.test.js
